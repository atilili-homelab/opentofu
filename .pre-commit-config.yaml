# Contrôles lancés avant chaque commit (par le hook global) et en CI.

default_stages: [pre-commit]

repos:
  # Contrôles génériques : syntaxe, hygiène des fichiers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  # Messages de commit : Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        args:
          [
            --verbose,
            feat,
            fix,
            refactor,
            docs,
            ci,
            build,
            chore,
            test,
            perf,
            revert,
          ]

  - repo: local
    hooks:
      - id: forgejo-runner-validate
        name: Validate Forgejo Actions files
        entry: forgejo-runner validate --directory .
        language: system
        pass_filenames: false
        files: (?:(?:^|/)action|^\.(?:forgejo|github|gitea)/workflows/[^/\n]+)\.ya?ml$
        types: [yaml]
