
manage_etc_hosts: true

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true

ssh_pwauth: false

users:
  - name: yoann
    groups: [sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHmioSel9+Ui/9dLqOQiQ6kV+LFzkvzjXS0VIQeS0ZeQ
  
# Desactive dhcpcd au boot et récupère la passerelle par défaut pour relais DNS
bootcmd:
  - systemctl disable --now dhcpcd 2>/dev/null || true
  - |
    GATEWAY=$(ip route | grep default | awk '{print $3}')
    [ -n "$GATEWAY" ] && echo "nameserver $GATEWAY" > /etc/resolv.conf